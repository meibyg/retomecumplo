<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Me Cumplo · 21 días para volver a confiar en ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Poppins:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2430;
  --ink-soft:#6B5A63;
  --wine:#6E2F43;
  --wine-deep:#521F31;
  --rose:#C88B85;
  --rose-soft:#E9CFC8;
  --bg:#F8F1ED;
  --surface:#FEFBF9;
  --line:#E7D8D1;
  --line-soft:#F0E4DE;
  --shadow:0 1px 2px rgba(46,36,48,.04), 0 8px 30px rgba(82,31,49,.06);
  --shadow-lg:0 2px 6px rgba(46,36,48,.05), 0 20px 50px rgba(82,31,49,.10);
  --serif:"Fraunces",Georgia,serif;
  --sans:"Poppins",-apple-system,system-ui,sans-serif;
  --hand:"Caveat",cursive;
  --wrap:600px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  font-weight:300;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.serif{font-family:var(--serif)}
.hand{font-family:var(--hand)}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(248,241,237,.82);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;padding-top:max(14px,env(safe-area-inset-top));
}
header.hidden{display:none}
.brand{font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
.brand small{display:block;font-family:var(--sans);font-weight:300;font-size:9px;letter-spacing:.22em;color:var(--ink-soft);text-transform:uppercase;margin-top:1px}
.menu-btn{background:none;border:none;cursor:pointer;padding:8px;display:flex;flex-direction:column;gap:4px}
.menu-btn span{display:block;width:22px;height:1.5px;background:var(--ink);border-radius:2px;transition:.25s}

/* ---------- menu overlay ---------- */
.menu{position:fixed;inset:0;z-index:60;background:var(--bg);opacity:0;visibility:hidden;transition:.28s;overflow-y:auto;padding:26px 24px calc(40px + env(safe-area-inset-bottom))}
.menu.open{opacity:1;visibility:visible}
.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.menu-head .brand{font-size:18px}
.close-btn{background:none;border:none;font-size:26px;color:var(--ink);cursor:pointer;line-height:1;padding:4px}
.menu nav{display:flex;flex-direction:column;gap:2px;max-width:var(--wrap);margin:0 auto}
.menu nav a{font-family:var(--serif);font-size:23px;color:var(--ink);text-decoration:none;padding:11px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:baseline;transition:.15s;cursor:pointer}
.menu nav a:hover{color:var(--wine);padding-left:8px}
.menu nav a .idx{font-family:var(--sans);font-size:11px;color:var(--rose);font-weight:400;letter-spacing:.1em}

/* ---------- app / views ---------- */
#app{max-width:var(--wrap);margin:0 auto;padding:34px 24px calc(80px + env(safe-area-inset-bottom))}
.view{animation:rise .5s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--rose);font-weight:500;margin-bottom:14px}
h1.title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1.08;letter-spacing:-.01em;margin-bottom:8px}
h2.section{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.12;margin-bottom:6px}
.lead{color:var(--ink-soft);font-size:15px;margin-bottom:26px;max-width:46ch}
.divider{width:38px;height:1px;background:var(--rose);margin:26px 0}

/* letters */
.letter{font-family:var(--serif);font-weight:300;font-size:18px;line-height:1.72;color:var(--ink)}
.letter p{margin-bottom:18px}
.letter .sign{font-family:var(--hand);font-size:30px;color:var(--wine);margin-top:6px;line-height:1}
.letter .sign small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}

/* prompt blocks */
.prompt{margin-bottom:26px}
.prompt label{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;margin-bottom:10px}
textarea,input[type=text],input[type=email],input[type=password]{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;font-family:var(--sans);font-size:16px;
  font-weight:300;color:var(--ink);resize:none;line-height:1.6;transition:.18s;
}
textarea{min-height:92px}
textarea:focus,input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgba(200,139,133,.12);background:#fff}
textarea::placeholder,input::placeholder{color:#C4B4AE;font-style:italic}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-weight:500;font-size:14px;letter-spacing:.02em;border:none;border-radius:100px;padding:15px 30px;cursor:pointer;transition:.2s;text-decoration:none}
.btn-primary{background:var(--wine);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--wine-deep);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-ghost{background:transparent;color:var(--wine);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--rose);background:var(--surface)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}

/* ---------- cover ---------- */
.cover{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 28px calc(48px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 70% at 50% -10%, rgba(200,139,133,.22), transparent 60%),
  radial-gradient(90% 60% at 50% 115%, rgba(110,47,67,.10), transparent 60%);
  pointer-events:none}
.cover .kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--rose);font-weight:500;margin-bottom:30px;opacity:0;animation:fade .9s .1s forwards}
.cover h1{font-family:var(--serif);font-weight:300;font-size:clamp(52px,20vw,96px);line-height:.92;letter-spacing:-.02em;color:var(--wine);opacity:0;animation:fade 1s .35s forwards}
.cover h1 em{font-style:italic;font-weight:400;display:block}
.cover .seal-mark{width:64px;height:64px;margin:34px 0;opacity:0;animation:fade 1s .8s forwards}
.cover .sub{font-family:var(--serif);font-size:20px;font-style:italic;color:var(--ink);max-width:20ch;line-height:1.4;opacity:0;animation:fade 1s 1.05s forwards}
.cover .enter{margin-top:44px;opacity:0;animation:fade 1s 1.4s forwards}.cover .namebox{margin-top:24px;width:min(320px,82vw);opacity:0;animation:fade 1s 1.55s forwards;display:flex;flex-direction:column;gap:10px}
.cover .namebox input{text-align:center;font-family:var(--hand);font-size:22px;background:rgba(255,255,255,.5);border:none;border-bottom:1.5px solid var(--rose);border-radius:12px;padding:9px 8px}
.cover .namebox input:focus{box-shadow:none;border-color:var(--wine);background:#fff}
.cover .namebox span{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px;font-family:var(--sans)}
.cover-note{margin-top:22px;font-size:12px;color:var(--ink-soft);max-width:26ch;opacity:0;animation:fade 1s 1.7s forwards}
.countdown{display:flex;gap:16px;margin-top:32px;opacity:0;animation:fade 1s .9s forwards}
.countdown>div{display:flex;flex-direction:column;align-items:center;min-width:52px}
.countdown b{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1;color:var(--wine)}
.countdown span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:7px}
.espera-note{margin-top:30px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink);opacity:0;animation:fade 1s 1.2s forwards}
.espera-preview{background:none;border:none;color:var(--ink-soft);font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:40px;cursor:pointer;opacity:0;animation:fade 1s 1.6s forwards;transition:.15s;border-bottom:1px solid var(--line)}
.espera-preview:hover{color:var(--wine);border-color:var(--rose)}
.espera-access{display:flex;gap:8px;align-items:center;margin-top:40px;opacity:0;animation:fade 1s 1.6s forwards}
.espera-access input{width:160px;text-align:center;background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:100px;padding:9px 14px;font-family:var(--sans);font-size:16px;color:var(--ink)}
.espera-access input:focus{outline:none;border-color:var(--rose);background:#fff}
.espera-access .espera-preview{margin-top:0;padding-bottom:2px}
@keyframes fade{to{opacity:1}}

/* seal svg base */
.seal-mark svg,.seal svg{display:block;width:100%;height:100%}

/* ---------- inicio / progress ---------- */
.progress-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center;box-shadow:var(--shadow);margin-bottom:12px}
.ring-wrap{position:relative;width:150px;height:150px;margin:6px auto 14px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num b{font-family:var(--serif);font-size:40px;font-weight:400;color:var(--wine);line-height:1}
.ring-num span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
.greet{font-family:var(--serif);font-size:26px;margin-bottom:4px}
.greet .hand{font-size:34px;color:var(--wine)}

/* day grid */
.grid-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:12px;margin-top:8px}
.day-cell{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;color:var(--ink-soft);cursor:pointer;transition:.2s;position:relative}
.day-cell:hover{border-color:var(--rose);transform:translateY(-2px)}
.day-cell.done{background:var(--wine);color:#fff;border-color:var(--wine);box-shadow:var(--shadow)}
.day-cell.today{border:1.5px solid var(--rose);box-shadow:0 0 0 4px rgba(200,139,133,.12)}
.day-cell.done::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.28),transparent 55%)}
.day-cell.locked{opacity:.55;cursor:default;background:var(--bg);border-style:dashed}
.day-cell.locked:hover{transform:none;border-color:var(--line)}
.day-cell.locked svg{display:block}

.section-links{display:flex;flex-direction:column;gap:0;margin-top:6px}
.section-links a{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line-soft);font-family:var(--serif);font-size:18px;color:var(--ink);cursor:pointer;text-decoration:none;transition:.15s}
.section-links a:hover{color:var(--wine);padding-left:8px}
.section-links a .arrow{color:var(--rose);font-family:var(--sans)}
.pchk{color:var(--wine);font-weight:600;font-family:var(--sans)}
.cta-day span:first-child{color:var(--wine);font-weight:500}

/* bloque de preparación en inicio */
.prep-card{background:linear-gradient(180deg,#fff,var(--surface));border:1px solid var(--rose-soft);border-radius:20px;padding:20px 22px;margin-top:16px;box-shadow:var(--shadow)}
.prep-card.done{border-color:var(--line);background:var(--surface)}
.prep-head{display:flex;align-items:center;justify-content:space-between}
.prep-count{font-family:var(--serif);font-size:15px;color:var(--wine)}
.prep-card .section-links a{font-size:17px;padding:13px 2px}
.prep-card .section-links a:last-child{border-bottom:none}

/* tarjeta de felicitación al completar */
.today-card{background:linear-gradient(180deg,#fff,var(--surface));border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:16px;box-shadow:var(--shadow)}
.today-card.celebrate{text-align:center;border-color:var(--rose-soft);background:linear-gradient(180deg,#fff,#faf0ee)}

/* ---------- day view ---------- */
.day-head{text-align:center;margin-bottom:8px}
.day-head .dnum{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--rose);font-weight:500}
.day-head .dname{font-family:var(--serif);font-size:30px;font-weight:400;line-height:1.1;margin-top:6px}
.quote{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.42;text-align:center;color:var(--wine);margin:24px auto;max-width:26ch;position:relative}
.quote::before{content:"“";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:44px;color:var(--rose-soft);font-family:var(--serif)}
.mission{background:linear-gradient(180deg,#fff,var(--surface));border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:28px}
.mission .lbl{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);font-weight:500;margin-bottom:8px}
.mission p{font-family:var(--serif);font-size:18px;line-height:1.5}

/* habit checks */
.habits{margin-bottom:28px}
.habit{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.habit:last-child{border-bottom:none}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.2s;background:var(--surface)}
.habit.on .check{background:var(--wine);border-color:var(--wine)}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:.2s}
.habit.on .check svg{opacity:1;transform:scale(1)}
.habit .htxt{font-size:15px;color:var(--ink);font-weight:300}
.habit.seal{margin-top:6px;padding:15px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom:1px solid var(--line)}
.habit.seal .htxt{font-family:var(--serif);font-size:17px}
.habit.seal.on{background:linear-gradient(180deg,#fff,#faf0ee);border-color:var(--rose-soft)}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
.check.pressed{animation:press .35s}

/* scale 1-10 */
.scale{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.scale button{flex:1;min-width:26px;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--sans);font-size:14px;color:var(--ink-soft);cursor:pointer;transition:.15s}
.scale button:hover{border-color:var(--rose)}
.scale button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.scale-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:8px;letter-spacing:.04em}

.grat{background:var(--surface);border:1px dashed var(--rose);border-radius:18px;padding:20px}
.grat .lbl{font-family:var(--hand);font-size:22px;color:var(--wine);margin-bottom:8px}

/* pager */
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:34px;gap:12px}
.pager button{background:none;border:1px solid var(--line);border-radius:100px;padding:12px 18px;font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;transition:.15s}
.pager button:hover:not(:disabled){border-color:var(--rose);color:var(--wine)}
.pager button:disabled{opacity:.3;cursor:default}

/* commitment */
.commit-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:var(--shadow-lg);text-align:center}
.commit-card .seal{width:52px;height:52px;margin:0 auto 16px}
.commit-card textarea{text-align:center;font-family:var(--serif);font-size:18px;min-height:120px;border-style:dashed}
.firma-line{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.firma-line input{text-align:center;font-family:var(--hand);font-size:26px;border:none;border-bottom:1.5px solid var(--rose);border-radius:0;background:transparent;max-width:260px;margin:0 auto}
.firma-line .fl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.fecha{font-size:12px;color:var(--ink-soft);margin-top:14px;letter-spacing:.06em}

/* tracker table */
.tracker-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
table.tracker{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
table.tracker th,table.tracker td{text-align:center;padding:0}
table.tracker thead th{font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.04em;color:var(--ink-soft);padding:8px 2px;vertical-align:bottom;line-height:1.2}
table.tracker thead th.dcol{writing-mode:horizontal-tb}
table.tracker tbody th{font-family:var(--serif);font-weight:400;font-size:13px;text-align:left;color:var(--wine);padding:6px 10px 6px 0;white-space:nowrap}
table.tracker td{border:1px solid var(--line-soft)}
.tcell{width:26px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tcell i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:block;transition:.15s}
.tcell.on i{background:var(--wine);border-color:var(--wine)}
table.tracker td.dayhdr{background:var(--line-soft)}

/* wallpapers */
.walls{display:flex;gap:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:4px 24px 20px;scroll-snap-type:x mandatory}
.wall{flex:none;width:min(230px,66vw);aspect-ratio:9/19.5;border-radius:26px;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:34px 24px;color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.wall .wtxt{font-family:var(--serif);font-size:24px;line-height:1.3;font-weight:400}
.wall .wtag{position:absolute;bottom:26px;left:0;right:0;font-size:9px;letter-spacing:.28em;text-transform:uppercase;opacity:.75}
.wall.w1{background:linear-gradient(160deg,#6E2F43,#3A1826)}
.wall.w2{background:linear-gradient(160deg,#C88B85,#8A4A54)}
.wall.w3{background:linear-gradient(160deg,#2E2430,#5A3547)}
.wall.w4{background:linear-gradient(160deg,#521F31,#864152)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.wthumb{aspect-ratio:9/16;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px 16px;color:#fff;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:.2s;overflow:hidden}
.wthumb:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.wthumb .wtxt{font-family:var(--serif);font-size:18px;line-height:1.25}
.wthumb .wig{position:absolute;bottom:14px;left:0;right:0;font-size:10px;letter-spacing:.22em;opacity:.85}
.wfull{max-width:300px;margin:0 auto;aspect-ratio:9/19.5;max-height:74vh;border-radius:30px;display:flex;flex-direction:column;text-align:center;padding:38px 26px 30px;color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.wfull .wtxt{font-family:var(--serif);line-height:1.32;flex:none}
.wfull .wframe{flex:1;margin:24px 0;border-radius:16px;border:2px solid rgba(255,255,255,.55);overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.10);min-height:0}
.wfull .wframe img{width:100%;height:100%;object-fit:cover;display:block}
.wframe-ph{color:rgba(255,255,255,.65);font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:lowercase}
.wcredit{flex:none;display:flex;flex-direction:column;gap:2px}
.wctag{font-family:var(--serif);font-size:16px;letter-spacing:.02em}
.wcby{font-family:var(--sans);font-size:11px;letter-spacing:.2em;opacity:.85}
.wupload{cursor:pointer}
.hint{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:2px;font-style:italic}
/* ===== diploma / certificado (formato historia) ===== */
.cert-wrap{--gold:#E7C48C;--gold-deep:#C79A52;--ivory:#F6ECD9}
.cert{position:relative;overflow:hidden;border-radius:26px;padding:52px 30px 44px;text-align:center;color:var(--ivory);
  background:
    radial-gradient(120% 55% at 50% -8%, rgba(231,196,140,.20), transparent 60%),
    radial-gradient(80% 50% at 50% 108%, rgba(200,139,133,.18), transparent 60%),
    linear-gradient(165deg,#5A2438 0%,#3B1728 48%,#2A1220 100%);
  box-shadow:0 30px 70px rgba(42,18,32,.45);}
.cert::before{content:"";position:absolute;inset:14px;border:1px solid rgba(231,196,140,.45);border-radius:16px;pointer-events:none}

let bypassLaunch=false, cdTimer=null;
function preLaunch(){return !bypassLaunch && LAUNCH && Date.now()<LAUNCH.getTime();}
function fmtCountdown(){let d=LAUNCH?LAUNCH.getTime()-Date.now():0;if(d<0)d=0;return{days:Math.floor(d/86400000),hrs:Math.floor(d%86400000/3600000),mins:Math.floor(d%3600000/60000),secs:Math.floor(d%60000/1000)};}
function stopCountdown(){if(cdTimer){clearInterval(cdTimer);cdTimer=null;}}
function startCountdown(){
  stopCountdown();
  const upd=()=>{
    const el=document.getElementById("cd");if(!el){stopCountdown();return;}
    const c=fmtCountdown();
    el.querySelector('[data-cd="d"]').textContent=c.days;
    el.querySelector('[data-cd="h"]').textContent=String(c.hrs).padStart(2,'0');
    el.querySelector('[data-cd="m"]').textContent=String(c.mins).padStart(2,'0');
    el.querySelector('[data-cd="s"]').textContent=String(c.secs).padStart(2,'0');
    if(!LAUNCH||LAUNCH.getTime()-Date.now()<=0){stopCountdown();bypassLaunch=true;go("cover");}
  };
  upd();cdTimer=setInterval(upd,1000);
}

function adminMatch(r){const q=(ADMIN.q||"").toLowerCase().trim();if(!q)return true;return ((r.nombre||"")+" "+(r.apellido||"")+" "+(r.email||"")).toLowerCase().includes(q);}
function adminRow(r,i){
 const dc=doneCountOf(r.data);
 const nm=((r.nombre||"")+" "+(r.apellido||"")).trim()||r.email;
 return `<div class="alumna" data-adminopen="${esc(r.email)}">
   <div class="al-info"><div class="al-name">${esc(nm)}</div><div class="al-mail">${esc(r.email||"")}</div></div>
   <div class="al-prog"><b>${dc}</b><span>/21</span></div>
 </div>`;
}
function gv(obj,path){let o=obj;for(const p of path.split("."))o=(o&&o[p]!=null)?o[p]:undefined;return o;}
function doneCountOf(d){let c=0;if(!d)return 0;for(let i=1;i<=21;i++)if(gv(d,"habits."+i+".mecumpli"))c++;return c;}
function adminDetail(row){
 const d=row.data||{};
 const nm=((row.nombre||"")+" "+(row.apellido||"")).trim()||row.email;
 const dc=doneCountOf(d);
 let grid="";
 for(let i=1;i<=21;i++)grid+=`<div class="day-cell ${gv(d,"habits."+i+".mecumpli")?'done':''}" style="cursor:default">${gv(d,"habits."+i+".mecumpli")?'✓':i}</div>`;
 const habitList=(Array.isArray(d.habitList)?d.habitList.map(h=>({id:h.id,t:h.label})):DEFAULT_HABITS.concat((d.customHabits||[]).map(h=>({id:h.id,t:h.label}))));
 let daysHTML="";
 for(let i=1;i<=21;i++){
   const dd=gv(d,"days."+i)||{}; const seal=gv(d,"habits."+i+".mecumpli");
   const any=dd.senti||dd.dificil||dd.aprendi||dd.gratitud||dd.escala||seal;
   if(!any) continue;
   const hb=habitList.filter(h=>gv(d,"habits."+i+"."+h.id)).map(h=>h.t);
   daysHTML+=`<div class="ad-day"><div class="ad-dh"><b>Día ${i}</b>${seal?'<span class="ad-seal">se cumplió ✓</span>':'<span class="ad-no">sin sello</span>'}${dd.escala?`<span class="ad-sc">${dd.escala}/10</span>`:''}</div>
     ${dd.senti?`<p><em>Cómo se sintió:</em> ${esc(dd.senti)}</p>`:''}
     ${dd.dificil?`<p><em>Lo más difícil:</em> ${esc(dd.dificil)}</p>`:''}
     ${dd.aprendi?`<p><em>Aprendió:</em> ${esc(dd.aprendi)}</p>`:''}
     ${dd.gratitud?`<p><em>Agradeció:</em> ${esc(dd.gratitud)}</p>`:''}
     ${hb.length?`<p class="ad-hab">${hb.join(" · ")}</p>`:''}
   </div>`;
 }
 const deseos=(d.deseos||[]);
 const promesa=gv(d,"compromiso.promesa");
 return `<section class="view">
   <button class="btn btn-ghost" data-adminback style="margin-bottom:18px">← Todas</button>
   <div class="ad-head">
     <h1 class="title" style="font-size:30px">${esc(nm)}</h1>
     <p class="al-mail">${esc(row.email||"")}</p>
     <p class="lead" style="margin-top:6px"><b style="color:var(--wine)">${dc} de 21 días cumplidos</b></p>
   </div>
   ${dc>=21?`<div class="cert-wrap" style="margin-bottom:22px">${certCardDone(nm,"")}<p class="cert-share">Ya se graduó. Puedes felicitarla. 🤍</p></div>`:''}
   <div class="grid-days" style="margin-bottom:24px">${grid}</div>
   ${promesa?`<div class="ad-day"><div class="ad-dh"><b>Su promesa</b></div><p>${esc(promesa)}</p></div>`:''}
   ${daysHTML||'<p class="hint" style="font-style:normal">Aún no ha escrito reflexiones.</p>'}
   ${deseos.length?`<div class="ad-day"><div class="ad-dh"><b>Lo que quiere para sí</b></div>${deseos.map(x=>`<p>${x.done?'✓ ':'· '}${esc(x.t)}</p>`).join("")}</div>`:''}
   <div class="btn-row mt"><button class="btn btn-ghost" data-adminback>← Volver a la lista</button></div>
 </section>`;
}

function firstUndoneDay(){for(let i=1;i<=21;i++)if(!get("habits."+i+".mecumpli"))return i;return 21;}

/* ---------- router ---------- */
function go(route){
 const [name,arg]=route.split(":");
 if(name==="dia"){const dn=parseInt(arg,10);if(isLocked(dn)){flash("Cumple el día "+(dn-1)+" para desbloquear el día "+dn+" 🔒");return;}if(!DATA.onboarded){DATA.onboarded=true;scheduleSave();}}
 if(name==="bienvenida"){if(!get("seen.bienvenida")){set("seen.bienvenida",true);}}
 if(name==="admin"){ADMIN.sel=null;}
 if(name==="fondos"){fondoSel=null;}
 current=route;
 window.scrollTo({top:0,behavior:"auto"});
 const hdr=document.getElementById("hdr");
 const ftr=document.getElementById("ftr");
 stopCountdown();
 if(name==="cover"||name==="espera"){hdr.classList.add("hidden");ftr.classList.add("hidden");}
 else{hdr.classList.remove("hidden");ftr.classList.remove("hidden");}
 app.innerHTML=VIEWS[name]?VIEWS[name](arg):VIEWS.inicio();
 if(name==="espera")startCountdown();
 closeMenu();
}
function rerender(){const[n,a]=current.split(":");const y=window.scrollY;app.innerHTML=VIEWS[n]?VIEWS[n](a):VIEWS.inicio();window.scrollTo(0,y);}

/* ---------- eventos ---------- */
app.addEventListener("click",e=>{
 const goEl=e.target.closest("[data-go]");
 if(goEl){go(goEl.dataset.go);return;}

 if(start){
   const nombre=(document.getElementById("inNombre").value||"").trim();

   const email=(document.getElementById("inEmail").value||"").trim().toLowerCase();
   if(cloudMode && !email){flash("Escribe tu correo para guardar tu avance 💌");return;}
   start.disabled=true;start.textContent="Un momento…";
   (async()=>{
     if(cloudMode && email){
       const remote=await cloudLoad(email);
       if(remote && typeof remote==="object"){ DATA=Object.assign(fresh(),remote); }
       if(!Array.isArray(DATA.customHabits))DATA.customHabits=[];
       if(!Array.isArray(DATA.deseos))DATA.deseos=[];
       if(!DATA.deseoReflex)DATA.deseoReflex={};
       if(!DATA.seen)DATA.seen={};
       if(typeof DATA.onboarded!=="boolean")DATA.onboarded=(doneCount()>0);
       if(!DATA.profile)DATA.profile={};
     }
     DATA.profile.name=nombre;DATA.profile.apellido=apellido;DATA.profile.email=email;
     DATA.started=true;
     if(!get("compromiso.fecha"))set("compromiso.fecha",todayStr());
     scheduleSave();
     go(DATA.onboarded?"inicio":"bienvenida");
   })();
   return;
 }
 const hb=e.target.closest("[data-habit]");
 if(hb){
   const p="habits."+hb.dataset.habit;const cur=!!get(p);set(p,!cur);
   hb.classList.toggle("on",!cur);hb.classList.toggle("off",cur);

   const cv=current.split(":")[0];

     const y=window.scrollY;
     setTimeout(()=>{app.innerHTML=VIEWS[cv](current.split(":")[1]);window.scrollTo(0,y);},380);
   }
   return;
 }
 const sc=e.target.closest("[data-scale]");
 if(sc){const p=sc.dataset.scale;set(p,parseInt(sc.dataset.val,10));sc.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));sc.classList.add("on");return;}

 if(e.target.closest("[data-addhabit]")){
   const inp=document.getElementById("newHabit");const v=(inp?.value||"").trim();
   if(!v){flash("Escribe un hábito primero ✍️");return;}
   ensureHabitList().push({id:"h"+Date.now(),label:v});scheduleSave();rerender();return;
 }
 const dh=e.target.closest("[data-delhabit]");
 if(dh){const id=dh.dataset.delhabit;DATA.habitList=ensureHabitList().filter(h=>h.id!==id);scheduleSave();rerender();return;}

 if(e.target.closest("[data-adddeseo]")){
   const inp=document.getElementById("newDeseo");const v=(inp?.value||"").trim();
   if(!v){flash("Escribe algo que quieras hacer 🤍");return;}
   if(!DATA.deseos)DATA.deseos=[];
   DATA.deseos.push({t:v,done:false});scheduleSave();rerender();return;
 }
 const dd=e.target.closest("[data-deldeseo]");
 if(dd){const i=+dd.dataset.deldeseo;(DATA.deseos||[]).splice(i,1);scheduleSave();rerender();return;}
 const dt=e.target.closest("[data-toggledeseo]");
 if(dt){const i=+dt.dataset.toggledeseo;if(DATA.deseos&&DATA.deseos[i]){DATA.deseos[i].done=!DATA.deseos[i].done;scheduleSave();rerender();}return;}

 if(e.target.closest("[data-adminauth]")){
   const inp=document.getElementById("adminSecret");const s=(inp?.value||"").trim();
   if(!s){flash("Escribe tu clave 🔑");return;}
   ADMIN.secret=s;ADMIN.err="";
   const btn=e.target.closest("[data-adminauth]");btn.disabled=true;btn.textContent="Entrando…";
   (async()=>{
     try{ const rows=await adminAll(s); ADMIN.rows=Array.isArray(rows)?rows:[]; ADMIN.auth=true; }
     catch(err){ ADMIN.err="Clave incorrecta o sin conexión. Revisa e intenta de nuevo."; }
     rerender();
   })();
   return;
 }
 if(e.target.closest("[data-adminreload]")){
   (async()=>{ try{ const rows=await adminAll(ADMIN.secret); ADMIN.rows=Array.isArray(rows)?rows:[]; }catch(err){} rerender(); })();
   return;
 }
 const ao=e.target.closest("[data-adminopen]");
 if(ao){ADMIN.sel=ao.dataset.adminopen;window.scrollTo(0,0);rerender();return;}
 if(e.target.closest("[data-adminback]")){ADMIN.sel=null;window.scrollTo(0,0);rerender();return;}
 const fo=e.target.closest("[data-fondo]");
 if(fo){fondoSel=+fo.dataset.fondo;window.scrollTo(0,0);rerender();return;}
 if(e.target.closest("[data-fondoback]")){fondoSel=null;window.scrollTo(0,0);rerender();return;}
 if(e.target.closest("[data-fotoclear]")){fondoPhoto=null;rerender();return;}
 if(e.target.closest("[data-previewgo]")){

 if(e.target.closest("[data-resetgo]")){

/* ---------- init ---------- */
(async function(){
 const raw=await Store.get(KEY);
 DATA=raw?JSON.parse(raw):fresh();
 if(!DATA.profile)DATA.profile={};
 if(!Array.isArray(DATA.customHabits))DATA.customHabits=[];
 if(!Array.isArray(DATA.deseos))DATA.deseos=[];
 if(!DATA.deseoReflex)DATA.deseoReflex={};
 if(!DATA.seen)DATA.seen={};
 if(typeof DATA.onboarded!=="boolean")DATA.onboarded=(doneCount()>0);
 if(cloudMode && DATA.profile.email){
   const remote=await cloudLoad(DATA.profile.email);
   if(remote && typeof remote==="object"){
     DATA=Object.assign(fresh(),remote);
     if(!DATA.profile)DATA.profile={};
     if(!Array.isArray(DATA.customHabits))DATA.customHabits=[];
     if(!Array.isArray(DATA.deseos))DATA.deseos=[];
     if(!DATA.deseoReflex)DATA.deseoReflex={};
   }
 }
 if(preLaunch()){ go("espera"); }
 else { go(DATA.started?"inicio":"cover"); }
})();
</script>
